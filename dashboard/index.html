<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zareya Dashboard — Login</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">zareya<span>.</span></div>
    <div class="login-tagline">Dashboard · Internal Access Only</div>

    <div class="login-error" id="login-error">Incorrect password. Try again.</div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input
        class="form-input"
        type="password"
        id="password"
        placeholder="Enter your dashboard password"
        onkeydown="if(event.key==='Enter')login()"
        autocomplete="current-password"
      >
    </div>

    <button class="btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="login()">
      Sign in →
    </button>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);">
      <a href="../index.html" style="font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='var(--rose)'" onmouseout="this.style.color='var(--text-3)'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to website
      </a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  /* Check if already logged in */
  if (localStorage.getItem('zareya-dashboard-auth')) {
    window.location.href = 'home.html';
  }

  async function login() {
    const pw  = document.getElementById('password').value;
    const err = document.getElementById('login-error');
    err.classList.remove('show');
    if (!pw) return;
    const ok = await dashLogin(pw);
    if (!ok) {
      err.classList.add('show');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }
</script>
</body>
</html>
