<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Studies — Zareya Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><div class="sb-logo-mark">zareya<span>.</span></div><div class="sb-badge">Admin</div></div>
    <nav class="sb-nav">
      <div class="sb-section-label">Overview</div>
      <a href="../home.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a>
      <div class="sb-section-label">Content</div>
      <a href="../blog/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Blog Posts</a>
      <a href="index.html" class="sb-item active"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>Case Studies</a>
      <div class="sb-section-label">Settings</div>
      <a href="../seo/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>SEO Settings</a>
      <div class="sb-section-label">Site</div>
      <a href="../../index.html" target="_blank" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span>View Website</a>
    </nav>
    <div class="sb-footer"><div class="sb-user" onclick="dashLogout()"><div class="sb-avatar" id="sb-avatar">K</div><div><div class="sb-user-name" id="sb-user-name">Kent</div><div class="sb-user-role" id="sb-user-role">Admin · Sign out</div></div></div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Case <em>Studies</em></div>
      <div class="topbar-actions"><a href="new.html" class="btn-primary">+ Add Case Study</a></div>
    </div>
    <div class="content">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Client</th><th>Category</th><th>Services</th><th>Status</th><th>Added</th><th></th></tr></thead>
          <tbody id="cs-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script src="../js/casestudies.js"></script>
<script>
  requireAuth();

  function render() {
    const list  = getCaseStudies();
    const tbody = document.getElementById('cs-tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-3);">No case studies yet — <a href="new.html" style="color:var(--rose);">add one</a></td></tr>';
      return;
    }
    tbody.innerHTML = list.map(c => `
      <tr>
        <td><div class="td-main">${c.client}</div></td>
        <td style="font-size:12px;color:var(--text-3);">${c.category}</td>
        <td>
          <div style="display:flex;flex-wrap:wrap;gap:4px;max-width:200px;">
            ${(c.services||[]).slice(0,3).map(s=>`<span style="font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--rose);background:var(--rose-10);border:1px solid var(--rose-18);padding:2px 7px;border-radius:2px;">${s}</span>`).join('')}
            ${(c.services||[]).length > 3 ? `<span style="font-size:11px;color:var(--text-3);">+${c.services.length-3} more</span>` : ''}
          </div>
        </td>
        <td><span class="badge ${c.published?'badge-green':'badge-grey'}">${c.published?'Live':'Draft'}</span></td>
        <td style="font-size:12px;color:var(--text-3);">${c.created_at||'—'}</td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="window.location='edit.html?id=${c.id}'">Edit</button>
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="togglePub('${c.id}')">${c.published?'Unpublish':'Publish'}</button>
            <button class="btn-danger" style="padding:4px 10px;font-size:11px;" onclick="del('${c.id}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function togglePub(id) {
    const c = toggleCSPublish(id);
    toast((c.published ? '"' + c.client + '" is now live on the Work page.' : 'Moved to draft.'));
    render();
  }

  function del(id) {
    if (!confirm('Delete this case study permanently?')) return;
    deleteCaseStudy(id); toast('Case study deleted.'); render();
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
