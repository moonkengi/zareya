<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts — Zareya Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><div class="sb-logo-mark">zareya<span>.</span></div><div class="sb-badge">Admin</div></div>
    <nav class="sb-nav">
      <div class="sb-section-label">Overview</div>
      <a href="../home.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a>
      <div class="sb-section-label">Content</div>
      <a href="index.html" class="sb-item active"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Blog Posts</a>
      <a href="../casestudies/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>Case Studies</a>
      <div class="sb-section-label">Settings</div>
      <a href="../seo/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>SEO Settings</a>
      <div class="sb-section-label">Site</div>
      <a href="../../index.html" target="_blank" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span>View Website</a>
    </nav>
    <div class="sb-footer"><div class="sb-user" onclick="dashLogout()"><div class="sb-avatar" id="sb-avatar">K</div><div><div class="sb-user-name" id="sb-user-name">Kent</div><div class="sb-user-role" id="sb-user-role">Admin · Sign out</div></div></div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Blog <em>Posts</em></div>
      <div class="topbar-actions">
        <a href="new.html" class="btn-primary">+ New Post</a>
      </div>
    </div>
    <div class="content">
      <!-- Filter tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button class="btn-ghost active-filter" id="f-all" onclick="filter('all',this)" style="font-size:11px;padding:6px 14px;border-color:var(--rose);color:var(--rose);">All</button>
        <button class="btn-ghost" id="f-pub" onclick="filter('published',this)" style="font-size:11px;padding:6px 14px;">Published</button>
        <button class="btn-ghost" id="f-draft" onclick="filter('draft',this)" style="font-size:11px;padding:6px 14px;">Drafts</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Read time</th><th>Status</th><th>Date</th><th></th></tr></thead>
          <tbody id="posts-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script src="../js/blog.js"></script>
<script>
  requireAuth();
  let currentFilter = 'all';

  function render() {
    let posts = getPosts();
    if (currentFilter === 'published') posts = posts.filter(p => p.published);
    if (currentFilter === 'draft') posts = posts.filter(p => !p.published);
    const tbody = document.getElementById('posts-tbody');
    if (!posts.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-3);">No posts yet — <a href="new.html" style="color:var(--rose);">write one</a></td></tr>';
      return;
    }
    tbody.innerHTML = posts.map(p => `
      <tr>
        <td><div class="td-main" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.title}</div></td>
        <td style="color:var(--text-3);font-size:12px;">${p.category}</td>
        <td style="color:var(--text-3);font-size:12px;">${p.read_time} min</td>
        <td><span class="badge ${p.published?'badge-green':'badge-grey'}">${p.published?'Live':'Draft'}</span></td>
        <td style="font-size:12px;color:var(--text-3);">${p.published_at || p.created_at || '—'}</td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="window.location='edit.html?id=${p.id}'">Edit</button>
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="togglePub('${p.id}')">${p.published?'Unpublish':'Publish'}</button>
            <button class="btn-danger" style="padding:4px 10px;font-size:11px;" onclick="del('${p.id}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function filter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.active-filter').forEach(b => { b.classList.remove('active-filter'); b.style.borderColor=''; b.style.color=''; });
    btn.classList.add('active-filter'); btn.style.borderColor='var(--rose)'; btn.style.color='var(--rose)';
    render();
  }

  function togglePub(id) {
    const p = togglePublish(id);
    toast(p.published ? '"' + p.title.slice(0,30) + '…" is now live.' : 'Moved to drafts.');
    render();
  }

  function del(id) {
    if (!confirm('Delete this post permanently?')) return;
    deletePost(id); toast('Post deleted.'); render();
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
