<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Settings — Zareya Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><div class="sb-logo-mark">zareya<span>.</span></div><div class="sb-badge">Admin</div></div>
    <nav class="sb-nav">
      <div class="sb-section-label">Overview</div>
      <a href="../home.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</a>
      <div class="sb-section-label">Content</div>
      <a href="../blog/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Blog Posts</a>
      <a href="../casestudies/index.html" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>Case Studies</a>
      <div class="sb-section-label">Settings</div>
      <a href="index.html" class="sb-item active"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>SEO Settings</a>
      <div class="sb-section-label">Site</div>
      <a href="../../index.html" target="_blank" class="sb-item"><span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span>View Website</a>
    </nav>
    <div class="sb-footer"><div class="sb-user" onclick="dashLogout()"><div class="sb-avatar" id="sb-avatar">K</div><div><div class="sb-user-name" id="sb-user-name">Kent</div><div class="sb-user-role" id="sb-user-role">Admin · Sign out</div></div></div></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">SEO <em>Settings</em></div>
      <div class="topbar-actions">
        <button class="btn-ghost" onclick="saveAll()">Save All Changes</button>
      </div>
    </div>
    <div class="content">

      <div class="card" style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="color:var(--rose);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div>
            <div style="font-size:14px;font-weight:500;color:var(--text);">Meta title: 30–60 characters for best results.</div>
            <div style="font-size:12px;color:var(--text-3);">Meta description: 120–160 characters. The meter shows green when you're in the ideal range.</div>
          </div>
        </div>
      </div>

      <div id="seo-pages"></div>

      <div style="margin-top:20px;">
        <button class="btn-primary" onclick="saveAll()" style="padding:12px 32px;">Save All SEO Changes →</button>
      </div>

    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/auth.js"></script>
<script src="../js/seo.js"></script>
<script>
  requireAuth();

  function renderPages() {
    const all  = getSEO();
    const wrap = document.getElementById('seo-pages');
    wrap.innerHTML = '';

    Object.entries(all).forEach(([key, page]) => {
      const score = getSEOScore(page.meta_title, page.meta_description);
      const card  = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '14px';
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--text);">${page.page}</div>
            <div style="font-size:12px;color:var(--text-3);">${page.file}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="font-size:11px;color:var(--text-3);">SEO Score</div>
            <div style="width:36px;height:36px;border-radius:50%;border:2px solid ${score>=80?'var(--green)':score>=50?'var(--amber)':'#e05050'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${score>=80?'var(--green)':score>=50?'var(--amber)':'#e05050'};">${score}</div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Meta Title</label>
          <input class="form-input" id="${key}_title" type="text" value="${page.meta_title||''}" placeholder="Page title — Zareya" oninput="liveCount('${key}_title','${key}_tc',60,'${key}_tm')">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px;">
            <div class="seo-meter" style="flex:1;margin-right:8px;"><div class="seo-meter-fill" id="${key}_tm" style="width:${Math.min((page.meta_title||'').length/60*100,100)}%;background:${titleColor((page.meta_title||'').length)};"></div></div>
            <div class="char-count" id="${key}_tc">${(page.meta_title||'').length} / 60</div>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Meta Description</label>
          <textarea class="form-textarea" id="${key}_desc" placeholder="Describe this page in 120–160 characters." style="min-height:72px;" oninput="liveCount('${key}_desc','${key}_dc',160,'${key}_dm')">${page.meta_description||''}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px;">
            <div class="seo-meter" style="flex:1;margin-right:8px;"><div class="seo-meter-fill" id="${key}_dm" style="width:${Math.min((page.meta_description||'').length/160*100,100)}%;background:${descColor((page.meta_description||'').length)};"></div></div>
            <div class="char-count" id="${key}_dc">${(page.meta_description||'').length} / 160</div>
          </div>
        </div>`;
      wrap.appendChild(card);
    });
  }

  function liveCount(inputId, countId, max, meterId) {
    const val = document.getElementById(inputId).value.length;
    const el  = document.getElementById(countId);
    const bar = document.getElementById(meterId);
    el.textContent  = val + ' / ' + max;
    el.className    = 'char-count' + (val > max ? ' over' : val > max*0.9 ? ' warn' : '');
    if (bar) {
      bar.style.width      = Math.min(val/max*100,100) + '%';
      bar.style.background = val > max ? '#e05050' : val > max*0.9 ? 'var(--amber)' : (val >= (max===60?30:120) ? 'var(--green)' : 'var(--rose)');
    }
  }

  function titleColor(len) { return len > 60 ? '#e05050' : len >= 30 ? 'var(--green)' : 'var(--rose)'; }
  function descColor(len)  { return len > 160 ? '#e05050' : len >= 120 ? 'var(--green)' : 'var(--rose)'; }

  function saveAll() {
    const all = getSEO();
    Object.keys(all).forEach(key => {
      const t = document.getElementById(key + '_title');
      const d = document.getElementById(key + '_desc');
      if (t && d) {
        saveSEO(key, { meta_title: t.value, meta_description: d.value });
      }
    });
    toast('All SEO settings saved.');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  document.addEventListener('DOMContentLoaded', renderPages);
</script>
</body>
</html>
